# Spark metrics configuration — registers the built-in PrometheusServlet
# sink for the Standalone cluster's Master and Worker daemon processes.
#
# This is the piece that was actually missing. spark.ui.prometheus.enabled
# (set via SPARK_MASTER_OPTS / SPARK_WORKER_OPTS in docker-compose.yml)
# controls whether a running Spark APPLICATION's own UI exposes its job/
# stage/task metrics in Prometheus format — a different thing from the
# Master/Worker daemon processes themselves. The /metrics/master/prometheus
# and /metrics/worker/prometheus endpoints (the ones Prometheus's
# scrape_configs are pointed at) are controlled by this metrics.properties
# sink registration instead, which Spark reads automatically from
# $SPARK_HOME/conf/metrics.properties at daemon startup — no extra
# command-line flag needed once this file is in place.
#
# Kept the existing spark.ui.prometheus.enabled=true settings in
# SPARK_MASTER_OPTS / SPARK_WORKER_OPTS too — harmless, and useful later if
# job-level Spark UI Prometheus metrics are ever wanted as well.

master.sink.prometheusServlet.class=org.apache.spark.metrics.sink.PrometheusServlet
master.sink.prometheusServlet.path=/metrics/master/prometheus

worker.sink.prometheusServlet.class=org.apache.spark.metrics.sink.PrometheusServlet
worker.sink.prometheusServlet.path=/metrics/worker/prometheus

# Bonus, not required for the Master/Worker fix above, but free to include:
# registers the same sink for actual running Spark applications (driver +
# executors), matching the spark.ui.prometheus.enabled flag already set.
# Exposed at /metrics/applications/prometheus on whichever host:port the
# application's own Spark UI ends up on (a different port per app/job, so
# not wired into prometheus.yml yet — would need dynamic service discovery
# to scrape reliably, out of scope for this pass).
applications.sink.prometheusServlet.class=org.apache.spark.metrics.sink.PrometheusServlet
applications.sink.prometheusServlet.path=/metrics/applications/prometheus
