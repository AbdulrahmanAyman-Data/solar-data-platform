connector.name=delta_lake
hive.metastore.uri=thrift://solar-hive-metastore:9083

# MinIO (S3-compatible) connection
hive.s3.endpoint=http://solar-minio:9000
hive.s3.aws-access-key=${ENV:MINIO_ROOT_USER}
hive.s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}
hive.s3.path-style-access=true
hive.s3.ssl.enabled=false
