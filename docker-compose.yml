# ============================================================
#  Solar & Environmental Data Engineering Platform — Unified Compose
#  Services: MinIO (data lake) · Kafka (KRaft) · Kafka-UI · Kafka-Exporter
#            Spark (master + worker + jupyter) · Spark Structured Streaming job
#            Hive Metastore (Postgres-backed) · Trino
#            Airflow (apiserver + scheduler + worker + triggerer + dag-processor)
#            Redis · Postgres (airflow + metastore)
#            Prometheus · Grafana · Superset (BI/GIS)
#            Streaming Poller (Open-Meteo -> Kafka, custom image)
#
#  All services share one external-style bridge network "pipeline-net"
#  so hostnames resolve consistently across every container — same
#  lesson carried over from the E-Commerce project: declare network
#  membership per-service in the Compose file itself, never rely on
#  a manual `docker network connect`.
# ============================================================

x-airflow-common: &airflow-common
  image: apache/airflow:3.1.6
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@solar-postgres-airflow:5432/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@solar-postgres-airflow:5432/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://solar-redis:6379/0
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__FERNET_KEY: ""
    # ---- Airflow 3.x: workers talk to the API server over HTTP, not the DB
    #      directly. Without this, "localhost" defaults to the worker's own
    #      container, causing "Connection refused" on every task. Same for
    #      the JWT secret - it must be identical across every Airflow
    #      service (apiserver, scheduler, worker, triggerer, dag-processor)
    #      or token verification fails between them. ----
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://solar-airflow-apiserver:8080/execution/"
    AIRFLOW__API_AUTH__JWT_SECRET: "solar-dev-only-fixed-jwt-secret-change-if-ever-exposed"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__METRICS__STATSD_ON: "false"
    # ---- Fixed login (username: airflow / password: airflow) for the
    #      local dev Simple Auth Manager - see docs/adr notes: this is
    #      explicitly a dev/testing-only auth manager per Airflow's own
    #      documentation, never used this way in production. ----
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "airflow:admin"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: "/opt/airflow/config/simple_auth_manager_passwords.json"
    AIRFLOW__SIMPLE_AUTH_MANAGER__USERS: "airflow:admin"
    AIRFLOW__SIMPLE_AUTH_MANAGER__PASSWORDS_FILE: "/opt/airflow/config/simple_auth_manager_passwords.json"
    # ---- Platform-specific connection info, consumed by DAG code ----
    KAFKA_BOOTSTRAP_SERVERS: solar-kafka:9092
    MINIO_ENDPOINT: http://solar-minio:9000
    MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    NASA_POWER_BASE_URL: https://power.larc.nasa.gov/api/temporal
    OPEN_METEO_ARCHIVE_URL: https://archive-api.open-meteo.com/v1/archive
  volumes:
    - ./orchestration/airflow/dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./config/airflow/simple_auth_manager_passwords.json:/opt/airflow/config/simple_auth_manager_passwords.json
    - airflow-logs:/opt/airflow/logs
  depends_on:
    solar-postgres-airflow:
      condition: service_healthy
    solar-redis:
      condition: service_healthy
  networks:
    - pipeline-net

services:

  # ──────────────────────────────────────────────
  #  DATA LAKE STORAGE — MinIO (replaces HDFS)
  # ──────────────────────────────────────────────
  solar-minio:
    image: pgsty/silo:latest
    container_name: solar-minio
    hostname: solar-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio-data:/data
    networks:
      - pipeline-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s

  # One-shot job: creates the bronze/silver/gold/checkpoints buckets on first boot
  solar-minio-init:
    image: pgsty/mc:latest
    container_name: solar-minio-init
    depends_on:
      solar-minio:
        condition: service_healthy
    networks:
      - pipeline-net
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://solar-minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin123};
      mc mb -p local/bronze;
      mc mb -p local/silver;
      mc mb -p local/gold;
      mc mb -p local/checkpoints;
      mc mb -p local/warehouse;
      exit 0;
      "
    restart: "no"

  # ──────────────────────────────────────────────
  #  SPARK
  # ──────────────────────────────────────────────
  solar-spark-master:
    image: local-pyspark
    build:
      context: ./docker/spark
      dockerfile: Dockerfile.spark
    container_name: solar-spark-master
    hostname: solar-spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8081:8080"
      - "7077:7077"
    environment:
      MINIO_ENDPOINT: http://solar-minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      SPARK_LOCAL_DIRS: /opt/spark-local  
      SPARK_MASTER_OPTS: "-Dspark.ui.prometheus.enabled=true"        
    volumes:
      - ./src:/opt/spark-notebooks/src
      - ./data:/opt/spark-notebooks/data
      - ./spark-local/master:/opt/spark-local   
      - ./config/spark/metrics.properties:/opt/spark/conf/metrics.properties:ro  
    networks:
      - pipeline-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      retries: 5

# ---- solar-spark-worker --------------------------------------------------
  solar-spark-worker:
    image: local-pyspark
    build:
      context: ./docker/spark
      dockerfile: Dockerfile.spark
    container_name: solar-spark-worker
    hostname: solar-spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://solar-spark-master:7077
    ports:
      - "8082:8081"
    environment:
      MINIO_ENDPOINT: http://solar-minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      SPARK_LOCAL_DIRS: /opt/spark-local  
      SPARK_WORKER_DIR: /opt/spark/work                 
      SPARK_WORKER_OPTS: "-Dspark.worker.cleanup.enabled=true -Dspark.worker.cleanup.interval=1800 -Dspark.worker.cleanup.appDataTtl=86400 -Dspark.ui.prometheus.enabled=true"         
    depends_on:
      solar-spark-master:
        condition: service_healthy
    volumes:
      - ./src:/opt/spark-notebooks/src
      - ./data:/opt/spark-notebooks/data
      - ./spark-local/worker:/opt/spark-local
      - ./config/spark/metrics.properties:/opt/spark/conf/metrics.properties:ro     
    networks:
      - pipeline-net

# ---- solar-jupyter ---------------------------------------------------
  solar-jupyter:
    image: local-pyspark
    build:
      context: ./docker/spark
      dockerfile: Dockerfile.spark
    container_name: solar-jupyter
    hostname: solar-jupyter
    ports:
      - "8888:8888"
    environment:
      MINIO_ENDPOINT: http://solar-minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      KAFKA_BOOTSTRAP_SERVERS: solar-kafka:9092
      PYTHONPATH: /opt/spark-notebooks/src:/opt/spark-notebooks
      SPARK_LOCAL_DIRS: /opt/spark-local          # <-- added
      PYSPARK_SUBMIT_ARGS: "--conf spark.jars.ivy=/opt/spark-local/ivy2 --packages io.delta:delta-spark_2.12:3.2.0,org.apache.hadoop:hadoop-aws:3.3.4 pyspark-shell"
    volumes:
      - .:/opt/spark-notebooks
      - /opt/spark-notebooks/.venv/
      - ./spark-local/jupyter:/opt/spark-local    # <-- added
    networks:
      - pipeline-net

# ---- solar-spark-streaming --------------------------------------------
  solar-spark-streaming:
    image: local-pyspark
    build:
      context: ./docker/spark
      dockerfile: Dockerfile.spark
    container_name: solar-spark-streaming
    hostname: solar-spark-streaming
    user: root
    command: >
      /bin/sh -c "
      mkdir -p /opt/spark-notebooks/checkpoints/weather_bronze &&
      chmod -R 777 /opt/spark-notebooks/checkpoints &&
      exec /opt/spark/bin/spark-submit
      --master spark://solar-spark-master:7077
      --conf spark.cores.max=4
      --conf spark.executor.memory=512m
      --conf spark.local.dir=/opt/spark-local
      --packages io.delta:delta-spark_2.12:3.2.0,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,org.apache.hadoop:hadoop-aws:3.3.4
      /opt/spark-notebooks/src/streaming/kafka_to_bronze.py
      "
    environment:
      MINIO_ENDPOINT: http://solar-minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      KAFKA_BOOTSTRAP_SERVERS: solar-kafka:9092
      PYTHONPATH: /opt/spark-notebooks/src:/opt/spark-notebooks
      SPARK_LOCAL_DIRS: /opt/spark-local          # <-- added
    depends_on:
      solar-spark-master:
        condition: service_healthy
      solar-kafka:
        condition: service_healthy
      solar-minio:
        condition: service_healthy
    volumes:
      - ./src:/opt/spark-notebooks/src
      - spark-streaming-checkpoints:/opt/spark-notebooks/checkpoints
      - ./spark-local/streaming:/opt/spark-local  # <-- added
    networks:
      - pipeline-net
    restart: unless-stopped

# ---- solar-spark-submit --------------------------------------------
  solar-spark-submit-client:
    image: local-pyspark
    build:
      context: ./docker/spark
      dockerfile: Dockerfile.spark
    container_name: solar-spark-submit-client
    hostname: solar-spark-submit-client
    # No daemon role, nothing to serve just stays alive so Airflow can
    # docker-exec spark-submit into it on demand.
    command: ["tail", "-f", "/dev/null"]
    environment:
      MINIO_ENDPOINT: http://solar-minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      KAFKA_BOOTSTRAP_SERVERS: solar-kafka:9092
      PYTHONPATH: /opt/spark-notebooks/src:/opt/spark-notebooks
      SPARK_LOCAL_DIRS: /opt/spark-local
    depends_on:
      solar-spark-master:
        condition: service_healthy
    volumes:
      - .:/opt/spark-notebooks
      - ./spark-local/submit-client:/opt/spark-local
    networks:
      - pipeline-net
  # ──────────────────────────────────────────────
  #  KAFKA (KRaft mode — no ZooKeeper)
  # ──────────────────────────────────────────────
  solar-kafka:
    image: apache/kafka:latest
    container_name: solar-kafka
    hostname: solar-kafka
    ports:
      - "9092:9092"     # internal
      - "29092:29092"   # external (من Windows / الهوست)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://solar-kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@solar-kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - pipeline-net
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 30s
      retries: 5

  solar-kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: solar-kafka-ui
    ports:
      - "8084:8080"   # Kafka UI
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: solar-kafka:9092
    depends_on:
      solar-kafka:
        condition: service_healthy
    networks:
      - pipeline-net

  # Exposes Kafka JMX metrics to Prometheus (consumer lag, throughput — see Part 22 monitoring)
  solar-kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: solar-kafka-exporter
    command: ["--kafka.server=solar-kafka:9092"]
    ports:
      - "9308:9308"
    depends_on:
      solar-kafka:
        condition: service_healthy
    networks:
      - pipeline-net

  # ──────────────────────────────────────────────
  #  STREAMING POLLER — Open-Meteo (~5 min) -> Kafka
  # ──────────────────────────────────────────────
  solar-streaming-poller:
    build:
      context: ./src/ingestion/streaming_poller
      dockerfile: Dockerfile
    container_name: solar-streaming-poller
    hostname: solar-streaming-poller
    command: python poller.py
    environment:
      KAFKA_BOOTSTRAP_SERVERS: solar-kafka:9092
      OPEN_METEO_BASE_URL: https://api.open-meteo.com/v1/forecast
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-300}
      MONITORED_LOCATIONS_FILE: /app/config/monitored_locations.json
      LOG_LEVEL: INFO
    volumes:
      - ./src/ingestion/streaming_poller:/app
      # - ./src/ingestion/streaming_poller/config:/app/config
    depends_on:
      solar-kafka:
        condition: service_healthy
    networks:
      - pipeline-net
    restart: unless-stopped

  # ──────────────────────────────────────────────
  #  HIVE METASTORE (catalog shared by Spark + Trino)
  # ──────────────────────────────────────────────
  solar-metastore-db:
    image: postgres:13-alpine
    container_name: solar-metastore-db
    hostname: solar-metastore-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
      POSTGRES_DB: metastore
    volumes:
      - metastore-db-data:/var/lib/postgresql/data
    networks:
      - pipeline-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d metastore"]
      interval: 10s
      retries: 5

  solar-hive-metastore:
    image: apache/hive:3.1.3
    container_name: solar-hive-metastore
    hostname: solar-hive-metastore
    ports:
      - "9083:9083"   # Thrift Metastore
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      IS_RESUME: "true"
      MINIO_ENDPOINT: http://solar-minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://solar-metastore-db:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive
        -Dhive.metastore.schema.verification=false
        -Dhive.metastore.schema.verification.record.version=false
    entrypoint: >
      /bin/sh -c "
      LIB=/opt/hadoop/share/hadoop/common/lib;
      TOOLS=/opt/hadoop/share/hadoop/tools/lib;
      ln -sf $$TOOLS/hadoop-aws*.jar $$LIB/ 2>/dev/null;
      ln -sf $$TOOLS/aws-java-sdk-bundle*.jar $$LIB/ 2>/dev/null;
      if ! ls $$LIB/hadoop-aws*.jar >/dev/null 2>&1; then
        echo 'hadoop-aws not found in tools/lib, downloading fallback...';
        curl -sL -o $$LIB/hadoop-aws-3.3.4.jar https://repo1.maven.org/maven2/org/apache/hadoop/hadoop-aws/3.3.4/hadoop-aws-3.3.4.jar;
        curl -sL -o $$LIB/aws-java-sdk-bundle-1.12.262.jar https://repo1.maven.org/maven2/com/amazonaws/aws-java-sdk-bundle/1.12.262/aws-java-sdk-bundle-1.12.262.jar;
      fi;
      echo 'S3A jars on classpath:';
      ls -la $$LIB/ | grep -i -E 'hadoop-aws|aws-java-sdk' || echo 'WARNING: still missing';
      CORE_SITE=/opt/hadoop/etc/hadoop/core-site.xml;
      echo '<configuration>' > $$CORE_SITE;
      echo '<property><name>fs.s3a.endpoint</name><value>'$$MINIO_ENDPOINT'</value></property>' >> $$CORE_SITE;
      echo '<property><name>fs.s3a.access.key</name><value>'$$MINIO_ROOT_USER'</value></property>' >> $$CORE_SITE;
      echo '<property><name>fs.s3a.secret.key</name><value>'$$MINIO_ROOT_PASSWORD'</value></property>' >> $$CORE_SITE;
      echo '<property><name>fs.s3a.path.style.access</name><value>true</value></property>' >> $$CORE_SITE;
      echo '<property><name>fs.s3a.connection.ssl.enabled</name><value>false</value></property>' >> $$CORE_SITE;
      echo '<property><name>fs.s3a.impl</name><value>org.apache.hadoop.fs.s3a.S3AFileSystem</value></property>' >> $$CORE_SITE;
      echo '<property><name>fs.s3a.aws.credentials.provider</name><value>org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider</value></property>' >> $$CORE_SITE;
      echo '</configuration>' >> $$CORE_SITE;
      echo 'wrote core-site.xml:';
      cat $$CORE_SITE;
      exec /entrypoint.sh
      "
    depends_on:
      solar-metastore-db:
        condition: service_healthy
      solar-minio:
        condition: service_healthy
    networks:
      - pipeline-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9083' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ──────────────────────────────────────────────
  #  TRINO — federated SQL over Delta Lake (MinIO + Hive Metastore)
  # ──────────────────────────────────────────────
  solar-trino:
    image: trinodb/trino:446           # pin version
    container_name: solar-trino
    hostname: solar-trino
    ports:
      - "8085:8080"   # Trino UI + REST API
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      # JMX exporter agent (port 9401, scraped by Prometheus) is attached via
      # config/trino/jvm.config, so it affects only the Trino server JVM, not the CLI.
    volumes:
      - ./config/trino/catalog:/etc/trino/catalog
      - ./config/trino/jvm.config:/etc/trino/jvm.config:ro
      - ./config/trino/jmx_exporter:/etc/trino/jmx_exporter:ro
    depends_on:
      solar-hive-metastore:
        condition: service_healthy
      solar-minio:
        condition: service_healthy
    networks:
      - pipeline-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 30s
      retries: 5

  # ──────────────────────────────────────────────
  #  AIRFLOW INFRASTRUCTURE
  # ──────────────────────────────────────────────
  solar-postgres-airflow:
    image: postgres:16
    container_name: solar-postgres-airflow
    hostname: solar-postgres-airflow
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data
    networks:
      - pipeline-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      retries: 5

  solar-redis:
    image: redis:7.2-bookworm
    container_name: solar-redis
    hostname: solar-redis
    networks:
      - pipeline-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  # ──────────────────────────────────────────────
  #  AIRFLOW SERVICES (batch: NASA POWER + Open-Meteo archive)
  # ──────────────────────────────────────────────
  solar-airflow-init:
    <<: *airflow-common
    container_name: solar-airflow-init
    command: bash -c "airflow db migrate"
    restart: "no"

  solar-airflow-apiserver:
    <<: *airflow-common
    container_name: solar-airflow-apiserver
    command: airflow api-server --workers 1
    ports:
      - "8083:8080"   # Airflow UI
    depends_on:
      solar-airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  solar-airflow-scheduler:
    <<: *airflow-common
    container_name: solar-airflow-scheduler
    command: airflow scheduler
    depends_on:
      solar-airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Provides the `docker` CLI binary to solar-airflow-worker (see below),
  # so an Airflow task can run `docker exec` into solar-jupyter to submit
  # Spark jobs, without touching Airflow's own entrypoint/command at all.
  solar-docker-cli-init:
    image: docker:27-cli
    container_name: solar-docker-cli-init
    entrypoint: sh -c "cp /usr/local/bin/docker /output/docker && chmod +x /output/docker && echo 'docker CLI copied.'"
    volumes:
      - docker-cli-bin:/output
    restart: "no"

  solar-airflow-worker:
    <<: *airflow-common
    container_name: solar-airflow-worker
    group_add:
      - "984"
    command: airflow celery worker
    volumes:
      - ./orchestration/airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./config/airflow/simple_auth_manager_passwords.json:/opt/airflow/config/simple_auth_manager_passwords.json
      - airflow-logs:/opt/airflow/logs
      - docker-cli-bin:/opt/docker-cli:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      solar-airflow-init:
        condition: service_completed_successfully
      solar-docker-cli-init:
        condition: service_completed_successfully
    restart: unless-stopped

  solar-airflow-triggerer:
    <<: *airflow-common
    container_name: solar-airflow-triggerer
    command: airflow triggerer
    depends_on:
      solar-airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  solar-airflow-dag-processor:
    <<: *airflow-common
    container_name: solar-airflow-dag-processor
    command: airflow dag-processor
    depends_on:
      solar-airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ──────────────────────────────────────────────
  #  MONITORING — Prometheus + Grafana (Part 22)
  # ──────────────────────────────────────────────
  solar-prometheus:
    image: prom/prometheus:latest
    container_name: solar-prometheus
    hostname: solar-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - solar-kafka-exporter
    networks:
      - pipeline-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      retries: 5

  solar-grafana:
    image: grafana/grafana:latest
    container_name: solar-grafana
    hostname: solar-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      solar-prometheus:
        condition: service_healthy
    networks:
      - pipeline-net

  # ──────────────────────────────────────────────
  #  BI / GIS — Apache Superset (Part 25 dashboard, Part 24 geospatial)
  # ──────────────────────────────────────────────
  solar-postgres-superset:
    image: postgres:16
    container_name: solar-postgres-superset
    hostname: solar-postgres-superset
    environment:
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
      POSTGRES_DB: superset
    volumes:
      - postgres-superset-data:/var/lib/postgresql/data
    networks:
      - pipeline-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset"]
      interval: 10s
      retries: 5

  solar-superset:
    image: apache/superset:latest
    container_name: solar-superset
    hostname: solar-superset
    user: root
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-change_this_secret_key_before_first_boot}
      MAPBOX_API_KEY: ${MAPBOX_API_KEY}
      DATABASE_DIALECT: postgresql
      DATABASE_HOST: solar-postgres-superset
      DATABASE_PORT: "5432"
      DATABASE_DB: superset
      DATABASE_USER: superset
      DATABASE_PASSWORD: superset
    entrypoint: >
      /bin/sh -c "
      . /app/.venv/bin/activate 2>/dev/null;
      uv pip install --no-cache-dir psycopg2-binary trino 2>/dev/null ||
      pip install --no-cache-dir psycopg2-binary trino 2>/dev/null ||
      pip install --no-cache-dir --target=/app/pythonpath psycopg2-binary trino;
      exec /app/docker/entrypoints/run-server.sh
      "
    volumes:
      - superset-data:/app/superset_home
      - ./config/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    depends_on:
      solar-postgres-superset:
        condition: service_healthy
      solar-trino:
        condition: service_healthy
    networks:
      - pipeline-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      retries: 5

  solar-superset-init:
    image: apache/superset:latest
    container_name: solar-superset-init
    user: root
    entrypoint: >
      /bin/sh -c "
      . /app/.venv/bin/activate 2>/dev/null;
      uv pip install --no-cache-dir psycopg2-binary 2>/dev/null ||
      pip install --no-cache-dir psycopg2-binary 2>/dev/null ||
      pip install --no-cache-dir --target=/app/pythonpath psycopg2-binary;
      superset db upgrade &&
      superset fab create-admin --username superset --firstname Admin --lastname User --email superset@example.com --password ${SUPERSET_ADMIN_PASSWORD:-superset} &&
      superset init
      "
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-change_this_secret_key_before_first_boot}
      DATABASE_DIALECT: postgresql
      DATABASE_HOST: solar-postgres-superset
      DATABASE_PORT: "5432"
      DATABASE_DB: superset
      DATABASE_USER: superset
      DATABASE_PASSWORD: superset
    volumes:
      - superset-data:/app/superset_home
      - ./config/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    depends_on:
      solar-postgres-superset:
        condition: service_healthy
    networks:
      - pipeline-net
    restart: "no"

  # ──────────────────────────────────────────────
  #   GIS — solar-gis-processor
  # ──────────────────────────────────────────────
  solar-gis-processor:
    image: local-gis
    build:
      context: ./docker/gis
      dockerfile: Dockerfile.gis
    container_name: solar-gis-processor
    hostname: solar-gis-processor
    ports:
      - "8889:8888"  # Jupyter — 8888
    environment:
      MINIO_ENDPOINT: http://solar-minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - ./gis:/opt/gis
    networks:
      - pipeline-net

# ──────────────────────────────────────────────
#  VOLUMES
# ──────────────────────────────────────────────
volumes:
  minio-data:
  metastore-db-data:
  postgres-airflow-data:
  airflow-logs:
  spark-streaming-checkpoints:
  prometheus-data:
  grafana-data:
  superset-data:
  postgres-superset-data:
  docker-cli-bin:
  kafka-data:

# ──────────────────────────────────────────────
#  NETWORK
# ──────────────────────────────────────────────
networks:
  pipeline-net:
    driver: bridge
